# 已知漏洞检查，仅报告当前私人仓库，不自动创建 issue。
name: Dependency audit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
  push:
    paths: ['Cargo.lock', '.cargo/audit.toml', '.github/workflows/audit.yml']
  pull_request:
    paths: ['Cargo.lock', '.cargo/audit.toml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
      - name: Check RustSec database
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo audit
          exit $LASTEXITCODE