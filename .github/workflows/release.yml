name: Build Windows test installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    env:
      QINGJIAN_UIACCESS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.96.0
          targets: i686-pc-windows-msvc
      - name: Fetch and verify pinned upstream data
        shell: pwsh
        run: ./tools/release/data-fetch.ps1
      - name: Install verified Inno Setup
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $path
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup hash mismatch' }
          Start-Process -FilePath $path -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -WindowStyle Hidden -Wait
      - name: Build test installer without registering the input method
        shell: pwsh
        run: ./apps/windows/installer/build.ps1
      - name: Installer checksums
        shell: pwsh
        run: Get-FileHash target/installer/*setup.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-File target/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-input-method-windows-test-installer
          path: |
            target/installer/*setup.exe
            target/installer/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error